<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz Application</title>

 

    <link rel="stylesheet" href="style.css">

</head>

 

<body>

 

    <div class="card" id="setup">

        <h1>Online Quiz Application</h1>

 

        <p>Select a quiz category:</p>

 

        <select id="category">

            <option value="web">Web Development</option>

            <option value="general">General Knowledge</option>

            <option value="science">Science</option>

        </select>

 

        <br>

        <button onclick="startQuiz()">Start Quiz</button>

    </div>

 

    <div class="card" id="quiz">

        <h2 id="question"></h2>

 

        <p>

            Question: <span id="current">1</span>/5

            | Time: <span id="timer">60</span> seconds

        </p>

 

        <progress id="progress" value="0" max="5"></progress>

 

        <div class="answers" id="answers"></div>

 

        <p id="feedback"></p>

 

        <button id="next" onclick="nextQuestion()" disabled>

            Next Question

        </button>

    </div>

 

    <div class="card" id="result">

        <h1>Quiz Results</h1>

 

        <p id="score"></p>

        <p id="percentage"></p>

        <p id="message"></p>

 

        <button onclick="showSetup()">Try Another Quiz</button>

    </div>

 

    <script src="script.js"></script>

 

</body>

</html>
